name: PC shell visual smoke (PR 70)
on:
  push:
    branches: [ui/pc-shell-issue-69]
    paths:
      - 'src/pc-visual-polish.css'
      - 'src/pc-playability-guide.js'
      - 'tests/pc-shell-smoke.cjs'
      - '.github/workflows/pc-shell-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pc-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --ignore-scripts --no-save --no-package-lock playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Test single-screen farm and side drawer
        run: node tests/pc-shell-smoke.cjs
      - name: Keep visual evidence and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-shell-smoke-screenshots
          path: test-output/pc-shell-smoke/
          if-no-files-found: warn
          retention-days: 7
