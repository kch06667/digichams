name: Sync PR84 original playable HTML bundles (temporary)
on:
  push:
    branches:
      - fix/pc-evolution-ranch-transition-20261030
    paths:
      - .github/workflows/pr84-sync-bundles.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'kch06667/digichams'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pc-evolution-ranch-transition-20261030
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync real embedded source into index and standalone
        run: |
          python3 tools/sync-embedded-evolution.py
          python3 tools/sync-embedded-farm.py
          python3 tools/sync-embedded-evolution.py --check
          python3 tools/sync-embedded-farm.py --check
          git diff --check
      - name: Commit only generated playable HTML files back to PR84
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html standalone.html
          if ! git diff --cached --quiet; then
            git commit -m "build(sync): update canonical evolution/farm scripts in both playable HTMLs"
            git push origin HEAD:fix/pc-evolution-ranch-transition-20261030
          fi
