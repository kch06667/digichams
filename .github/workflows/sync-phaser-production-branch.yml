name: Install Phaser default into real playable HTML (PR57)
on:
  push:
    branches: [feat/phaser-default-production-20261029]
    paths:
      - "tools/sync-phaser-production.py"
      - "tools/phaser-production-entry.cjs"
      - "src/dev-phaser-farm-launch.js"
      - "src/phaser-arena-entry-choice.js"
      - ".github/workflows/sync-phaser-production-branch.yml"
  workflow_dispatch:
concurrency:
  group: sync-phaser-production-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Phaser bridge syntax before touching real game
        run: |
          node --check src/dev-phaser-farm-launch.js
          node --check src/phaser-arena-entry-choice.js
          node --check tools/phaser-production-entry.cjs
      - name: Append the exact production entry to both full HTML games
        run: |
          python3 tools/sync-phaser-production.py --write
          python3 tools/sync-phaser-production.py --check
          python3 tools/sync-embedded-farm.py --check
          python3 tools/sync-embedded-hunt.py --check
          python3 tools/sync-embedded-evolution.py --check
      - name: Commit only original game HTML back to PR branch
        run: |
          git add index.html standalone.html
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Wire Phaser as default in both original full-game HTML entries"
            git fetch origin "${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
            git rebase "refs/remotes/origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
