name: Remake cage UI gate
on:
  pull_request:
    paths:
      - 'src/remake-cage-view.js'
      - 'src/remake-cage-view.css'
      - 'src/pc-playability-guide.js'
      - 'tests/remake-cage-view.cjs'
      - 'tests/remake-cage-view-browser.py'
      - '.github/workflows/remake-cage-ui.yml'
  workflow_dispatch:
jobs:
  cage-view:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static API and syntax checks
        run: node --test tests/remake-cage-view.cjs
      - name: Install Chromium browser test dependency
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Verify two-row cage navigation and mobile isolation
        run: python tests/remake-cage-view-browser.py
