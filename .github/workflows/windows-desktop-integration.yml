name: Windows desktop integration (local review only)

on:
  push:
    branches:
      - integration/windows-ranch-review-20261030
      - release/windows-pc-rc-20261030
    paths:
      - 'desktop/**'
      - 'src/pc-ranch-sprite-guard.js'
      - 'src/pc-playability-guide.js'
      - '.github/workflows/windows-desktop-integration.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'src/pc-ranch-sprite-guard.js'
      - 'src/pc-playability-guide.js'
      - '.github/workflows/windows-desktop-integration.yml'
  workflow_dispatch:

# Push and PR checks for the same integration branch should not run several
# expensive Windows EXE builds simultaneously.
concurrency:
  group: windows-review-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  launcher-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check launcher syntax and sandboxed protocol
        run: |
          node --check desktop/main.cjs
          node --check desktop/tests/launcher.test.cjs
          node --check desktop/tests/electron-smoke.cjs
          npm --prefix desktop test
          npm --prefix desktop run test:release

  windows-native:
    runs-on: windows-latest
    needs: launcher-unit
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Electron, builder and Playwright locally
        run: npm --prefix desktop install --no-audit --no-fund --no-package-lock
      - name: Verify launcher protocol and path containment
        run: npm --prefix desktop test
      - name: Launch the real source game in Electron and test saving/reload
        run: npm --prefix desktop run test:ui
      - name: Package unpacked Windows app (no upload)
        run: npm --prefix desktop run build:dir
      - name: Verify locally packaged EXE resources and UI
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist\desktop\win-unpacked\Digimon Championship.exe'
          $root = Join-Path $env:GITHUB_WORKSPACE 'dist\desktop\win-unpacked\resources\game'
          if (!(Test-Path $exe)) { throw "Unpacked Windows EXE missing: $exe" }
          @('index.html','src\farm-core.js','assets\farm\continuous_ranch_preview.svg','phaser-lab\index.html') | ForEach-Object {
            if (!(Test-Path (Join-Path $root $_))) { throw "Packaged resource missing: $_" }
          }
          $env:DC_TEST_PACKAGE_ROOT = $root
          npm --prefix desktop run test:release
          if ($LASTEXITCODE -ne 0) { throw 'Packaged original game asset audit failed' }
          $env:DC_PACKAGED_EXE = $exe
          npm --prefix desktop run test:ui
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Electron gameplay smoke failed' }
      # RC is tested in GitHub's Windows runner, but is NEVER uploaded as a
      # publicly downloadable Actions artifact. Only the user may build a
      # private Windows copy from their extracted source tree.
      - name: Build and verify private Windows portable RC (no upload)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'release/windows-pc-rc-20261030')
        timeout-minutes: 20
        shell: pwsh
        run: |
          npm --prefix desktop run build:win
          if ($LASTEXITCODE -ne 0) { throw 'Portable NSIS EXE builder failed' }
          $portable = @(Get-ChildItem 'dist\desktop' -Filter 'Digimon-Championship-*-Windows-x64.exe' -File)
          if ($portable.Count -ne 1) { throw "Expected exactly 1 portable EXE; found $($portable.Count)" }
          if ($portable[0].Length -lt 10000000) { throw 'Portable EXE is unexpectedly small' }
          $file = [IO.File]::OpenRead($portable[0].FullName)
          try {
            if ($file.ReadByte() -ne 77 -or $file.ReadByte() -ne 90) { throw 'Portable EXE has no MZ/PE executable header' }
          } finally { $file.Dispose() }
          $sha = (Get-FileHash $portable[0].FullName -Algorithm SHA256).Hash
          Write-Host "PASS private portable Windows RC: $($portable[0].Name) SHA256=$sha"
          Write-Host 'No asset, ROM or executable artifact uploaded.'
