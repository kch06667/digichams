name: Original-game mobile simulated long-play and save soak
on:
  pull_request:
    paths:
      - "tests/mobile-longplay-browser.py"
      - "docs/MOBILE_LONGPLAY_SOAK_20261029.md"
      - ".github/workflows/mobile-longplay-tests.yml"
      - "src/farm-core.js"
      - "src/hex-farm-ui.js"
      - "src/hunt-ui.js"
      - "index.html"
      - "standalone.html"
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  mobile-longplay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify original embedded gameplay sources
        run: |
          python3 tools/sync-embedded-farm.py --check
          python3 tools/sync-embedded-hunt.py --check
          python3 tools/sync-embedded-evolution.py --check
      - name: Install Chromium and Playwright
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Run two simulated hours with browser heap and save guards
        run: python3 tests/mobile-longplay-browser.py
