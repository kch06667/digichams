name: Farm source synchronization and regression
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/farm-core.js"
      - "src/hex-farm-ui.js"
      - "src/hex-farm.css"
      - "index.html"
      - "standalone.html"
      - "tools/sync-embedded-farm.py"
      - "tools/import-farm-graphics-v0232.py"
      - "tests/test_farm_graphics_import.py"
      - "tests/farm-offmap-recovery.cjs"
      - ".github/workflows/verify-farm-sources.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject out-of-sync HTML bundles
        run: python3 tools/sync-embedded-farm.py --check
      - name: Farm and championship regressions
        run: |
          node --test tests/farm-avoidance.cjs tests/farm-navigation.cjs
          node tests/farm-core.cjs
          node --test tests/farm-offmap-recovery.cjs
          node tests/championship-core.cjs
      - name: Safe graphics importer tests
        run: python3 -m unittest discover -s tests -p test_farm_graphics_import.py -v
