name: Phaser lab (isolated) tests
on:
  pull_request:
    paths:
      - 'phaser-lab/**'
      - 'src/phaser-arena-entry-choice.js'
      - 'tools/build-phaser-optin-page.cjs'
      - 'tests/phaser-main-entry.cjs'
      - 'tests/phaser-main-entry-browser.py'
      - 'tests/phaser-owned-multi-browser.py'
      - 'src/dev-phaser-farm-launch.js'
      - 'src/dev-phaser-commit.js'
      - 'tests/phaser-owned-settlement.cjs'
      - 'tools/build-dev-page.cjs'
      - 'tests/build-dev-page.cjs'
      - 'tests/phaser-farm-handoff-browser.py'
      - 'tests/phaser-preview.cjs'
      - 'tools/build-phaser-preview.cjs'
      - 'src/battle-core.js'
      - 'src/arena-navigation-core.js'
      - 'src/arena-original-core.js'
      - 'src/battle-settlement-core.js'
      - 'src/battle-commit-core.js'
      - 'src/battle-owned-optin.js'
      - 'src/battle-owned-optin-ui.js'
      - 'tools/build-owned-battle-optin.cjs'
      - 'src/evolution-core.js'
      - 'index.html'
      - 'src/care-core.js'
      - 'src/championship-core.js'
      - 'tools/export-phaser-atlas.py'
      - 'tools/export-phaser-duel.py'
      - 'tests/test_phaser_duel.py'
      - 'tests/phaser-duel-browser-smoke.py'
      - '.gitignore'
      - 'tests/phaser-lab.cjs'
      - 'tests/phaser-domain-bridge.cjs'
      - 'tests/phaser-realtime.cjs'
      - 'tests/arena-navigation-core.cjs'
      - 'tests/arena-original-parity.cjs'
      - 'tests/battle-settlement-core.cjs'
      - 'tests/battle-hp-tp-parity.cjs'
      - 'tests/battle-interruption-reload.cjs'
      - 'tests/battle-cup-final-reward.cjs'
      - 'tests/battle-full-state-parity.cjs'
      - 'tests/battle-evolution-settlement-parity.cjs'
      - 'tests/battle-commit-safety.cjs'
      - 'tests/battle-legacy-storage.cjs'
      - 'tests/battle-owned-optin.cjs'
      - 'tests/battle-owned-optin-browser.py'
      - 'tests/battle-owned-completion-browser.py'
      - 'tests/fixtures/battle-owned-optin-qa.js'
      - 'tests/fixtures/battle-commit-browser.html'
      - 'tests/battle-experience-parity.cjs'
      - 'tests/phaser-private-art.cjs'
      - 'tests/phaser-farm.cjs'
      - 'tests/phaser-preview.cjs'
      - 'tests/phaser-browser-smoke.py'
      - 'tests/battle-browser-storage-smoke.py'
      - 'tools/build-phaser-preview.cjs'
      - 'tests/test_phaser_atlas.py'
      - '.github/workflows/phaser-slice-tests.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - run: node --check phaser-lab/game.js
      - run: node --check src/dev-phaser-farm-launch.js
      - run: node --check src/phaser-arena-entry-choice.js
      - run: node --test tests/phaser-main-entry.cjs
      - run: node --test tests/phaser-owned-settlement.cjs
      - run: node --test tests/build-dev-page.cjs
      - run: node --check phaser-lab/realtime-core.js
      - run: node --check src/arena-original-core.js
      - run: node --check src/battle-settlement-core.js
      - run: node --check src/battle-commit-core.js
      - run: node --check src/battle-owned-optin.js
      - run: node --check tools/build-owned-battle-optin.cjs
      - run: node --test tests/phaser-lab.cjs tests/phaser-domain-bridge.cjs tests/arena-navigation-core.cjs tests/arena-original-parity.cjs tests/battle-settlement-core.cjs tests/battle-experience-parity.cjs tests/battle-hp-tp-parity.cjs tests/battle-interruption-reload.cjs tests/battle-cup-final-reward.cjs tests/battle-full-state-parity.cjs tests/battle-evolution-settlement-parity.cjs tests/battle-commit-safety.cjs tests/battle-legacy-storage.cjs tests/battle-owned-optin.cjs tests/phaser-realtime.cjs tests/phaser-private-art.cjs tests/phaser-farm.cjs tests/phaser-preview.cjs
      - run: python -m unittest discover -s tests -p 'test_phaser_*.py' -v
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Phaser locally for browser tests
        run: npm install --ignore-scripts --no-save --no-package-lock phaser@3.90.0
      - name: Install Playwright Chromium
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Convert privately held Agumon GIFs to local-only Phaser sheets
        run: |
          python3 -m pip install 'Pillow>=10,<13'
          python3 tools/export-phaser-atlas.py --species 아구몬
          test -f phaser-lab/local-assets/action_30.png
          test -f phaser-lab/local-assets/action_32.png
          test -f phaser-lab/local-assets/manifest.json
      - name: Generate safe offline preview bundle
        run: |
          node tools/build-phaser-preview.cjs dist/phaser-preview
          test -s dist/phaser-preview/vendor/phaser.min.js
          test -s dist/phaser-preview/vendor/PHASER_LICENSE.txt
      - name: Desktop/touch browser smoke, safe preview offline
        run: python3 tests/phaser-browser-smoke.py
      - name: Privately export BOTH original species for local duel QA (never upload)
        run: |
          python3 tools/export-phaser-duel.py
          test -s phaser-lab/local-assets/duel-agumon/action_0.png
          test -s phaser-lab/local-assets/duel-gabumon/action_0.png
      - name: Local-only original Agumon vs Gabumon 1v1 browser smoke
        run: python3 tests/phaser-duel-browser-smoke.py
      - name: Original playable game arena button opt-in and legacy fallback
        run: python3 tests/phaser-main-entry-browser.py
      - name: Actual owned 2v2/3v3 Phaser readonly handoff (desktop/touch)
        run: python3 tests/phaser-owned-multi-browser.py
      - name: Dev farm handoff and explicit settlement (desktop/touch; guarded backup)
        run: python3 tests/phaser-farm-handoff-browser.py
      - name: Desktop/touch isolated browser save denial and reload regression
        run: python3 tests/battle-browser-storage-smoke.py
      - name: Build optional live-game HTML with default-off battle settlement
        run: node tools/build-owned-battle-optin.cjs dist/battle-optin --qa
      - name: Optional battle save UI smoke (desktop/touch)
        run: python3 tests/battle-owned-optin-browser.py
      - name: Actual original owned-battle AI completion, save and reload (desktop/touch)
        run: python3 tests/battle-owned-completion-browser.py
