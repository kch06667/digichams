name: Phaser lab (isolated) tests
on:
  pull_request:
    paths:
      - 'phaser-lab/**'
      - 'tools/export-phaser-atlas.py'
      - 'tests/phaser-lab.cjs'
      - 'tests/phaser-preview.cjs'
      - 'tests/phaser-browser-smoke.py'
      - 'tools/build-phaser-preview.cjs'
      - 'tests/test_phaser_atlas.py'
      - '.github/workflows/phaser-slice-tests.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - run: node --check phaser-lab/game.js
      - run: node --test tests/phaser-lab.cjs tests/phaser-preview.cjs
      - run: python -m unittest discover -s tests -p 'test_phaser_atlas.py' -v
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Phaser locally for browser tests
        run: npm install --ignore-scripts --no-save --no-package-lock phaser@3.90.0
      - name: Install Playwright Chromium
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Desktop/touch browser smoke
        run: python3 tests/phaser-browser-smoke.py
