name: Phaser lab (isolated) tests
on:
  pull_request:
    paths:
      - 'phaser-lab/**'
      - 'tools/export-phaser-atlas.py'
      - 'tests/phaser-lab.cjs'
      - 'tests/test_phaser_atlas.py'
      - '.github/workflows/phaser-slice-tests.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - run: node --check phaser-lab/game.js
      - run: node --test tests/phaser-lab.cjs
      - run: python -m unittest discover -s tests -p 'test_phaser_atlas.py' -v
