name: Reconstruct uploaded v0.24 checkpoint
on:
  push:
    branches:
      - integration/v0.23.3-safe
    paths:
      - ".upload_chunks/**"
      - ".github/workflows/reconstruct-v024.yml"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Assemble chunked sources
        shell: python
        run: |
          import base64, hashlib, json, pathlib
          root = pathlib.Path('.')
          manifest = json.loads((root / '.upload_chunks/manifest.json').read_text())
          for item in manifest['files']:
              dest = root / item['path']
              dest.parent.mkdir(parents=True, exist_ok=True)
              parts = []
              for p in item['parts']:
                  data = (root / '.upload_chunks' / p).read_bytes()
                  if item.get('encoding') == 'base64':
                      data = base64.b64decode(data)
                  parts.append(data)
              content = b''.join(parts)
              actual = hashlib.sha256(content).hexdigest()
              if item.get('sha256'): assert actual == item['sha256'], f"Integrity failure for {dest}: {actual}"
              dest.write_bytes(content)
              print('assembled', dest, len(content))
      - name: Restore integrated tests and build scripts
        shell: python
        run: |
          import base64, gzip, json, pathlib
          payload = pathlib.Path('.upload_chunks/source_text_bundle_v024.gz.b64')
          if payload.exists():
              data = json.loads(gzip.decompress(base64.b64decode(payload.read_text().strip())))
              permitted = {'package.json','CHECKPOINT.json','README.md','START_HERE_v0233.md','TEST_REPORT_v0.23.3.md','TEST_REPORT_v0.24.0-pre.md','MERGE_GUIDE_CHAMPIONSHIP.md','MERGE_GUIDE_FARM_GRAPHICS.md'}
              for relative, content in data.items():
                  path = pathlib.PurePosixPath(relative)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert path.parts[0] in {'tests','tools'} or relative in permitted, relative
                  out = pathlib.Path(relative)
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_text(content, encoding='utf-8')
                  print('restored', relative)
      - name: Synchronize inline source blocks across both HTML versions
        shell: python
        run: |
          import pathlib, re
          pairs = [('farm-core-v0143','src/farm-core.js'),('hex-farm-v0143','src/hex-farm-ui.js'),('championship-core-v023','src/championship-core.js')]
          for name in ('index.html','standalone.html'):
              f = pathlib.Path(name)
              text = f.read_text(encoding='utf-8')
              for tag, source in pairs:
                  content = pathlib.Path(source).read_text(encoding='utf-8').strip()
                  pat = re.compile(r'(<script id="' + re.escape(tag) + r'">)([\s\S]*?)(</script>)')
                  text, n = pat.subn(lambda m: m.group(1) + '\n' + content + '\n' + m.group(3), text, count=1)
                  assert n == 1, (name, tag)
              f.write_text(text, encoding='utf-8')
      - name: Commit reconstructed files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .upload_chunks
          git add -A
          if ! git diff --cached --quiet; then git commit -m "build: reconstruct v0.24 checkpoint from verified chunks"; git push; fi
      - name: Verify pure Node tests and bundled scripts
        shell: bash
        run: |
          node --test tests/farm-navigation.cjs tests/farm-avoidance.cjs
          node tests/championship-core.cjs
          python3 -m unittest discover -s tests -p 'test_bundle_sync.py' -v
