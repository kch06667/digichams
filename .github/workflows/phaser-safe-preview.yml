name: Phaser safe web preview
on:
  push:
    branches: [main]
    paths:
      - 'phaser-lab/index.html'
      - 'phaser-lab/sw.js'
      - 'phaser-lab/pwa.js'
      - 'phaser-lab/icon.svg'
      - 'phaser-lab/manifest.webmanifest'
      - 'phaser-lab/domain-bridge.js'
      - 'phaser-lab/arena-techniques.js'
      - 'phaser-lab/private-art-loader.js'
      - 'src/battle-core.js'
      - 'src/arena-navigation-core.js'
      - 'src/care-core.js'
      - 'src/championship-core.js'
      - 'phaser-lab/logic.js'
      - 'phaser-lab/game.js'
      - 'phaser-lab/farm.html'
      - 'phaser-lab/farm-model.js'
      - 'phaser-lab/farm.js'
      - 'tools/build-phaser-preview.cjs'
      - '.github/workflows/phaser-safe-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-phaser-lab
  cancel-in-progress: true
jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Phaser 3 for safe offline bundle
        run: npm install --ignore-scripts --no-save --no-package-lock phaser@3.90.0
      - name: Prepare safe asset-free deploy artifact
        run: |
          node --test tests/phaser-lab.cjs tests/phaser-domain-bridge.cjs tests/arena-navigation-core.cjs tests/phaser-realtime.cjs tests/phaser-private-art.cjs tests/phaser-farm.cjs tests/phaser-preview.cjs
          node tools/build-phaser-preview.cjs dist/phaser-preview
          test ! -d dist/phaser-preview/assets
          test ! -d dist/phaser-preview/local-assets
          test -s dist/phaser-preview/vendor/phaser.min.js
          test -s dist/phaser-preview/vendor/PHASER_LICENSE.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/phaser-preview
      - id: deployment
        uses: actions/deploy-pages@v4
